# Web layer UTF-8 encoding
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true


# JPA layer UTF-8 encoding
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true



server.port = 8080
#server.servlet.session.timeout=5
spring.session.timeout.seconds=300

#spring.mvc.static-path-pattern=/**
#lista vrednosti direktorijuma
#spring.resources.static-locations=

#spring.mvc.view.prefix: /WEB-INF/jsp/
#spring.mvc.view.suffix: .jsp

logging.level.web=DEBUG



spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/voznja?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyAccess=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false&characterEncoding=UTF-8&useUnicode=true

spring.datasource.sqlScriptEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# = JPA / HIBERNATE
# ===============================

# Prikazuj SQL upite koje JPA generise
spring.jpa.show-sql = true

spring.jpa.properties.hibernate.ejb.bytecode.provider=org.hibernate.bytecode.internal.javassist.BytecodeProviderImpl


# Hibernate ddl-auto: 
#	validate: validate the schema, makes no changes to the database.
#	update: update the schema.
#	create: creates the schema, destroying previous data.
#	create-drop: drop the schema at the end of the session.

spring.jpa.hibernate.ddl-auto = create

# Script initialization
# Script needs to be in resources ex. resources/data/mysql/mtSuperScript.sql
# initialization-mode:
# always - Always initialize the datasource.
# embedded - Only initialize an embedded datasource.
# never - Do not initialize the datasource.

#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
server.servlet.contextPath=/driving


# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect




spring.jpa.show-sql = true

logging.level.org.springframework.web: DEBUG
logging.level.org.hibernate: ERROR



log4j.rootLogger=INFO, FILE
log4j.appender.FILE=org.apache.log4j.FileAppender
log4j.appender.FILE.File=../logs/rest-json.log
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n

#Allows longer names

management.endpoints.web.exposure.include=*

spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.check-template-location=false
